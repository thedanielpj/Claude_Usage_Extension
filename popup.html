<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usage Overlay for Claude</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <label class="row" for="toggle">
      <span class="name">Show overlay</span>
      <span class="switch">
        <input id="toggle" type="checkbox" role="switch" checked>
        <span class="track"></span>
      </span>
    </label>
  </main>
  <!-- TEMP-TEST: remove this block, popup-testpanel.js and the two script tags before release -->
  <section class="test">
    <div class="test-title">Test burn animation</div>
    <div id="t-tiers" class="tiers"></div>
    <div class="pick">
      <select id="t-word" aria-label="Word"></select>
      <button id="t-play" type="button">Play</button>
    </div>
  </section>
  <footer>
    <a id="privacy" href="https://github.com/thedanielpj/Claude_Usage_Extension/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy details</a>
  </footer>
  <script src="src/usage.js"></script> <!-- TEMP-TEST -->
  <script src="popup.js"></script>
  <script src="popup-testpanel.js"></script> <!-- TEMP-TEST -->
</body>
</html>
